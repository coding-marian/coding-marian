<svg fill="none" viewBox="0 0 950 250" width="100%" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f093fb" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="holoTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="neonOrb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="950" height="250" rx="18" fill="url(#bgCanvas)" stroke="url(#cyberBorder)" stroke-width="1.5" />

  <!-- Neon Ambient Cyber Glows -->
  <circle cx="120" cy="50" r="85" fill="#00f2fe" fill-opacity="0.14" filter="url(#neonOrb)" />
  <circle cx="830" cy="190" r="95" fill="#f093fb" fill-opacity="0.12" filter="url(#neonOrb)" />

  <!-- Code Editor Window Header -->
  <rect x="25" y="16" width="900" height="34" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1" />
  
  <!-- Traffic Light Window Controls -->
  <circle cx="48" cy="33" r="5" fill="#ff5f56" />
  <circle cx="66" cy="33" r="5" fill="#ffbd2e" />
  <circle cx="84" cy="33" r="5" fill="#27c93f" />

  <!-- Editor Active Tab -->
  <rect x="110" y="21" width="180" height="24" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
  <text x="200" y="37" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#38bdf8">
    ⚛️ maria_architecture.tsx
  </text>

  <text x="905" y="37" text-anchor="end" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="10.5" fill="#64748b">
    v2.6 // status: production
  </text>

  <!-- Cyber Grid Subtle Lines -->
  <line x1="30" y1="50" x2="920" y2="50" stroke="#1e293b" stroke-width="0.8" />

  <!-- Hero Identity -->
  <text x="475" y="106" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="url(#holoTitle)" letter-spacing="3">
    MARIA N.
  </text>

  <text x="475" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" fill="#e2e8f0" letter-spacing="1">
    Senior Full Stack Developer • Python &amp; React • AI &amp; Agentic Systems
  </text>

  <!-- Creative Holographic Tech Badges -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    <!-- Badge 1 -->
    <rect x="55" y="172" width="195" height="34" rx="17" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" />
    <text x="152" y="194" text-anchor="middle" fill="#38bdf8">⚛️ React 19 &amp; Next.js 15</text>

    <!-- Badge 2 -->
    <rect x="270" y="172" width="195" height="34" rx="17" fill="url(#pillGrad1)" stroke="#818cf8" stroke-width="1" />
    <text x="367" y="194" text-anchor="middle" fill="#818cf8">🐍 Python &amp; FastAPI</text>

    <!-- Badge 3 -->
    <rect x="485" y="172" width="195" height="34" rx="17" fill="url(#pillGrad1)" stroke="#c084fc" stroke-width="1" />
    <text x="582" y="194" text-anchor="middle" fill="#c084fc">🤖 Agentic AI &amp; LangGraph</text>

    <!-- Badge 4 -->
    <rect x="700" y="172" width="195" height="34" rx="17" fill="url(#pillGrad1)" stroke="#34d399" stroke-width="1" />
    <text x="797" y="194" text-anchor="middle" fill="#34d399">☁️ Cloud &amp; Microservices</text>
  </g>
</svg>