<svg fill="none" viewBox="0 0 950 210" width="100%" height="210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#334155" stroke-width="0.6" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="950" height="210" rx="14" fill="url(#bg)" stroke="url(#borderGlow)" stroke-width="1.6" />
  <rect width="950" height="210" rx="14" fill="url(#grid)" />

  <!-- Subtle Ambient Glows -->
  <circle cx="90" cy="50" r="100" fill="#38bdf8" fill-opacity="0.08" />
  <circle cx="860" cy="160" r="110" fill="#34d399" fill-opacity="0.07" />

  <!-- Top Accent Bar -->
  <rect x="25" y="16" width="900" height="4" rx="2" fill="url(#borderGlow)" />

  <!-- Title: MARIA N. -->
  <text x="475" y="66" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="url(#nameGrad)" letter-spacing="2.5">
    MARIA N.
  </text>

  <!-- Subtitle from JD -->
  <text x="475" y="98" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="600" fill="#38bdf8" letter-spacing="0.5">
    Senior Full Stack Developer | React &amp; Python | AI Integration
  </text>

  <!-- Location & Metrics Sub-line -->
  <text x="475" y="126" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    📍 Maryland, United States  •  5+ Years Experience  •  99.5% Production SLA
  </text>

  <!-- JD Core Skill Pills -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">
    <!-- Frontend -->
    <rect x="55" y="150" width="195" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="152" y="171" text-anchor="middle" fill="#38bdf8">⚛️ React &amp; Next.js</text>

    <!-- Backend -->
    <rect x="270" y="150" width="195" height="32" rx="16" fill="#1e293b" stroke="#fbbf24" stroke-width="1" />
    <text x="367" y="171" text-anchor="middle" fill="#fbbf24">🐍 Python &amp; FastAPI</text>

    <!-- AI -->
    <rect x="485" y="150" width="195" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="582" y="171" text-anchor="middle" fill="#c084fc">🤖 AI Agents &amp; RAG</text>

    <!-- Cloud & Infra -->
    <rect x="700" y="150" width="195" height="32" rx="16" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="797" y="171" text-anchor="middle" fill="#34d399">☁️ Cloud &amp; DevOps</text>
  </g>
</svg>